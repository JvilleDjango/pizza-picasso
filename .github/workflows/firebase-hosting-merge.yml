name: Deploy Pizza Picasso to Firebase
'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web app
        run: npm ci && npm run build

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIZZA_PICASSO_1249C }}'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy API function
        run: firebase deploy --only functions:api --project pizza-picasso-1249c --non-interactive

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIZZA_PICASSO_1249C }}'
          channelId: live
          projectId: pizza-picasso-1249c
